# Dependency update automation (P2 — supply-chain hygiene).
# Dependabot opens grouped PRs so backend (uv), frontend (npm) and the
# GitHub Actions used by CI stay patched without manual tracking.
version: 2
updates:
  # Backend Python deps, resolved from backend/pyproject.toml + uv.lock.
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine patch/minor bumps keeps the noise down;
      # majors still come through individually so they get a real review.
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Frontend Node deps, resolved from frontend/package-lock.json.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # The actions pinned in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
